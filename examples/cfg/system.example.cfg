# Copy this file to /cfg/system.cfg on the SD card.
# Missing file or missing keys use the firmware defaults shown here.

# Wi-Fi.
wifi.ssid=Your WiFi
wifi.password=your-password
wifi.displayName=Saved network
# Possible values: true, false
wifi.autoConnect=false

# CPU.
# Possible values: 80, 160, 240.
cpu.mhz=240
# Possible values: fixed, balanced.
cpu.governor=fixed

# Time.
# Possible values: 24h, 12h.
time.format=24h
# Possible values:
# iso      -> 2026-06-28
# mdy      -> 06/28/2026
# dmy      -> 28/06/2026
# dmy-dot  -> 28.06.2026
# weekday  -> Sun, Jun 28
date.format=iso
# Possible values: https, ntp.
time.syncProtocol=https
# For https, use a full URL returning the existing time JSON shape.
# For ntp, use a hostname such as pool.ntp.org.
time.syncServer=https://time.now/developer/api/ip
# Possible values: auto, utc, z, +HH:MM, -HH:MM, UTC+H, UTC-H.
# NTP does not provide timezone data; auto falls back to UTC.
timezone=auto

# Sensor calibration.
# Celsius offset applied to the SHTC3 ambient temperature reading.
sensor.tempOffsetC=0

# Temperature display.
# Possible values: c, f, celsius, fahrenheit.
temp.unit=c

# Shell/home UI.
# Possible values: default, ultra-large.
layout=default
# MENU button hotkey app id. Built-in apps use their built-in id, pink apps use pink:<hash>.
home.sunBtnApp=contact_links
# Comma-separated widgets. Possible values:
# temp, hum, cpuTemp, sd, battery, notifications, logoText,
# buttonHelp, wallpaper, weather.
# Special values: all, none.
home.widgets=temp,hum,cpuTemp,sd,battery,logoText,buttonHelp

# Lockscreen/sleep-clock UI.
# This icon is shown above the sleep clock and is independent from home widgets.
# Any printable one-character icon from the active icon font.
lockscreen.topIcon=S
# Possible values: true, false
lockscreen.date=true
