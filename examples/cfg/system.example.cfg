# Copy this file to /cfg/system.cfg on the SD card.
# Missing file or missing keys use the firmware defaults shown here.

# Wi-Fi.
wifi.ssid=Your WiFi
wifi.password=your-password
wifi.displayName=Saved network
# Possible values: true, false
wifi.autoConnect=false
# Turn Wi-Fi off after this many minutes without touch/button activity; 0=never.
wifi.autoOffMinutes=0

# CPU.
# Possible values: 80, 160, 240.
cpu.mhz=240
# Possible values: fixed, balanced.
cpu.governor=fixed

# Periodic app hooks. Apps request a cadence from 1 minute through 1 day;
# minIntervalMinutes clamps overly frequent requests globally. Zero disables
# all hooks, including periodic time sync, while retaining the sleep clock.
periodic.minIntervalMinutes=1
# Skip app hooks at the fixed 15% low-battery threshold.
periodic.disableOnLowBattery=true

# Notifications raised by periodic tasks.
# Possible values: off, silent, on.
notifications.mode=silent
# Possible values: chime, droplet, pulse, ascend, knock.
notifications.ringtone=chime

# Time.
# Possible values: 24h, 12h.
time.format=24h
# Possible values:
# iso      -> 2026-06-28
# mdy      -> 06/28/2026
# dmy      -> 28/06/2026
# dmy-dot  -> 28.06.2026
# weekday  -> Sun, Jun 28
date.format=iso
# Possible values: https, ntp.
time.syncProtocol=https
# Periodic network time synchronization. 0 disables it.
# Possible values: 0, 1, 3, 6, 12, 24.
time.syncIntervalHours=24
# For https, use a full URL returning the existing time JSON shape.
# For ntp, use a hostname such as pool.ntp.org.
time.syncServer=https://time.now/developer/api/ip
# Possible values: auto, utc, z, +HH:MM, -HH:MM, UTC+H, UTC-H.
# NTP does not provide timezone data; auto falls back to UTC.
timezone=auto

# Sensor calibration.
# Celsius offset applied to the SHTC3 ambient temperature reading.
sensor.tempOffsetC=0

# Temperature display.
# Possible values: c, f, celsius, fahrenheit.
temp.unit=c

# Shell/home UI.
# Possible values: default, ultra-large.
layout=default
# MENU button hotkey app id. Built-in apps use their built-in id, pink apps use pink:<hash>.
home.sunBtnApp=contact_links
# Comma-separated widgets. Possible values:
# temp, hum, cpuTemp, sd, battery, notifications, logoText,
# buttonHelp, wallpaper, weather.
# Special values: all, none.
home.widgets=temp,hum,cpuTemp,sd,battery,logoText,buttonHelp
# Text drawn over the home wallpaper. The status bar always remains black.
# Possible values: black, white.
home.textColor=black
# Anchors the status widgets; button help moves to the opposite edge.
# Possible values: top, bottom.
home.widgetGravity=top

# Lockscreen/sleep-clock UI.
# App id of the selected app widget, or none.
lockscreen.widget=none
# This icon is shown above the sleep clock and is independent from home widgets.
# Any printable one-character icon from the active icon font.
lockscreen.topIcon=S
# Possible values: true, false
lockscreen.date=true
# Whole minutes before opening the sleep clock. 0 disables inactivity sleep;
# supported custom values are 1 through 255.
lockscreen.inactivityMinutes=2
